<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger UI</title>
    <link rel="stylesheet" href="http://localhost:8080/BackEnd_war/webjars/swagger-ui/4.1.3/swagger-ui.css">
    <script src="http://localhost:8080/BackEnd_war/webjars/swagger-ui/4.1.3/swagger-ui-bundle.js"></script>
    <script src="http://localhost:8080/BackEnd_war/webjars/swagger-ui/4.1.3/swagger-ui-standalone-preset.js"></script>
</head>
<body>
<div id="swagger-ui"></div>
<script>
    const ui = SwaggerUIBundle({
        url: "http://localhost:8080/BackEnd_war/api/openapi.json", // URL per il file openapi.json
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIBundle.presets.swaggerUi
        ],
        requestInterceptor: (req) => {
            if (req.url && !req.url.includes('openapi.json')) {
                req.url = req.url.replace(/^http:\/\/localhost:8080/, '');  // Rimuovi il dominio
                req.url = "/BackEnd_war" + req.url;  // Aggiungi il prefisso /BackEnd
            }
            return req;
        }
    });
</script>
</body>
</html>
